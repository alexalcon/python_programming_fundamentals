<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1f3d"/>
    </linearGradient>
    <linearGradient id="py" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b8bbe"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
  </defs>
  <rect width="1180" height="420" rx="18" fill="url(#bg)"/>

  <!-- candlestick chart motif -->
  <g opacity="0.9">
    <polyline points="640,300 700,270 760,285 820,220 880,240 940,170 1000,190 1060,120 1120,140" fill="none" stroke="#4b8bbe" stroke-width="3" stroke-linejoin="round"/>
    <g stroke-width="2">
      <line x1="700" y1="245" x2="700" y2="300" stroke="#26a69a"/><rect x="690" y="258" width="20" height="30" fill="#26a69a"/>
      <line x1="760" y1="265" x2="760" y2="310" stroke="#ef5350"/><rect x="750" y="272" width="20" height="26" fill="#ef5350"/>
      <line x1="820" y1="195" x2="820" y2="255" stroke="#26a69a"/><rect x="810" y="208" width="20" height="36" fill="#26a69a"/>
      <line x1="880" y1="220" x2="880" y2="265" stroke="#ef5350"/><rect x="870" y="228" width="20" height="24" fill="#ef5350"/>
      <line x1="940" y1="145" x2="940" y2="205" stroke="#26a69a"/><rect x="930" y="158" width="20" height="36" fill="#26a69a"/>
      <line x1="1000" y1="170" x2="1000" y2="215" stroke="#ef5350"/><rect x="990" y="178" width="20" height="24" fill="#ef5350"/>
      <line x1="1060" y1="95" x2="1060" y2="155" stroke="#26a69a"/><rect x="1050" y="108" width="20" height="36" fill="#26a69a"/>
    </g>
  </g>

  <text x="70" y="150" font-size="60" font-weight="700" fill="#ffffff">Python Programming</text>
  <text x="70" y="220" font-size="60" font-weight="700" fill="url(#py)">Fundamentals</text>
  <rect x="70" y="248" width="120" height="4" rx="2" fill="#ffd43b"/>
  <text x="70" y="295" font-size="24" fill="#c9d1e6">Core Python, from control flow to OOP,</text>
  <text x="70" y="328" font-size="24" fill="#c9d1e6">through algorithmic trading examples.</text>
  <text x="70" y="380" font-family="Consolas, Menlo, monospace" font-size="18" fill="#7f8bb0">$ python trading_functions_demo.py</text>
</svg>
